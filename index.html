<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surreal GenAI Video Ideas Generator</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">
                <span class="neon-text">SURREAL</span>
                <span class="subtitle">GenAI Video Ideas</span>
            </h1>
            <p class="tagline">Where Italodisco meets Sci-Fi in Liminal Dreams</p>
        </header>

        <div class="input-section">
            <div class="input-container">
                <input 
                    type="text" 
                    id="promptInput" 
                    placeholder="Enter a surreal concept or leave blank for random inspiration..."
                    class="prompt-input"
                >
                <button id="generateBtn" class="generate-btn">
                    <span class="btn-text">GENERATE</span>
                    <span class="btn-icon">✨</span>
                </button>
            </div>
        </div>

        <div class="ideas-container" id="ideasContainer">
            <div class="welcome-message">
                <h3>Ready to dive into the surreal?</h3>
                <p>Enter a concept or let the algorithm take you on a journey through liminal spaces, nostalgic memories, and disco-fueled dreams.</p>
            </div>
        </div>

        <div class="aesthetic-info">
            <div class="theme-tags">
                <span class="tag surreal">SURREAL</span>
                <span class="tag liminal">LIMINAL</span>
                <span class="tag nostalgic">NOSTALGIC</span>
            </div>
            <div class="aesthetic-tags">
                <span class="tag italodisco">ITALODISCO</span>
                <span class="tag scifi">SCI-FI</span>
                <span class="tag kitsch">KITSCH</span>
                <span class="tag camp">CAMP</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
